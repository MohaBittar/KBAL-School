<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KBAL-School</title>
  <meta name="description" content="KBAL-School — learn, explore and connect." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div id="app">
    <div id="announce-bar" class="announce-bar hidden"></div>

    <header class="topbar">
      <button id="nav-toggle" class="icon-btn" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <a class="brand" href="#/">
        <img id="brand-logo" class="brand-logo hidden" alt="" />
        <span id="brand-name" class="brand-name">KBAL-School</span>
      </a>

      <div class="topbar-search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="global-search" type="search" placeholder="Search pages, classes, people…" autocomplete="off" />
      </div>

      <nav class="topbar-actions">
        <div id="quick-theme" class="quick-theme"></div>
        <div id="user-area"></div>
      </nav>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="view" class="main" tabindex="-1"></main>
    </div>

    <footer id="footer" class="footer"></footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="assets/js/main.js"></script>
  <noscript>
    <div style="padding:40px;text-align:center">KBAL-School requires JavaScript to run.</div>
  </noscript>
</body>
</html>
